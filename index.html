<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Git Aquarium</title>
  </head>
  <body>
    <header class="masthead">
      <div>
        <h1>Git <em>Aquarium</em></h1>
        <p class="tagline">Your repository is an ecosystem. Your code is alive.</p>
      </div>
      <form id="source">
        <label for="repo">Public GitHub repository</label>
        <div class="field">
          <input id="repo" placeholder="owner/repo or github.com URL" autocomplete="off" spellcheck="false" required />
          <button id="import">Import</button>
        </div>
        <button type="button" id="demo" class="ghost">Load demo</button>
      </form>
    </header>
    <p id="error" role="alert"></p>

    <main class="deck">
      <div class="column">
        <section class="tank" aria-label="Aquarium">
          <div class="view">
            <canvas id="scene" role="img" aria-label="Aquarium: simulated organisms foraging for food"></canvas>
            <canvas id="overlay" aria-hidden="true"></canvas>
          </div>
          <p id="date" class="caption"></p>
          <p id="alarm" class="caption" hidden></p>
          <div class="transport">
            <div id="timeline" role="progressbar" aria-label="Replay progress" aria-valuemin="0" aria-valuemax="100">
              <div id="fill"></div>
              <div id="marks"></div>
            </div>
            <form id="controls">
              <button type="button" id="pause" class="primary">Pause</button>
              <fieldset id="speed">
                <legend>Speed</legend>
                <label><input type="radio" name="speed" value="1" checked /><span>1x</span></label>
                <label><input type="radio" name="speed" value="2" /><span>2x</span></label>
                <label><input type="radio" name="speed" value="4" /><span>4x</span></label>
              </fieldset>
              <label class="seed">Seed <input id="seed" type="number" step="1" value="1" required /></label>
              <button class="ghost">Reset</button>
            </form>
          </div>
        </section>

        <section class="stats" aria-labelledby="stats-title">
          <h2 id="stats-title">Simulated measurements</h2>
          <dl>
            <div><dt>Population</dt><dd id="s-pop">0</dd></div>
            <div><dt>Mean energy</dt><dd id="s-energy">0</dd></div>
            <div><dt>Births</dt><dd id="s-births">0</dd></div>
            <div><dt>Deaths</dt><dd id="s-deaths">0</dd></div>
            <div><dt>Mutations</dt><dd id="s-mutations">0</dd></div>
            <div><dt>Water stress</dt><dd id="s-stress">0%</dd></div>
          </dl>
        </section>
      </div>

      <aside class="panel">
        <section>
          <h2>Dataset</h2>
          <div id="dataset"></div>
          <details id="notices">
            <summary></summary>
            <ul></ul>
          </details>
        </section>
        <section>
          <h2>Lineages <span>one per observed branch</span></h2>
          <ul id="legend"></ul>
        </section>
        <section>
          <h2>Repository events <span>and their rules</span></h2>
          <ol id="log"></ol>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
